{% extends 'users/account/account.html' %}
{% load static %}

{% block account_content %}
    <div x-data="orderController">
        <template x-if="order">
            <div class="flex flex-col gap-8">
                <div>
                    <div class="flex justify-between">
                        <h3 class="h3" x-text="'Заказ #' + order.id"></h3>
                        <a class="flex gap-2.5 items-center rounded-lg bg-[#F6F8FB] uppercase text-[#186FD4] text-[12px] font-medium py-1.5 px-3.5"
                           href="javascript:history.back()">
                            <p><</p>
                            <p>Вернуться</p>
                        </a>
                    </div>
                    <div class="flex items-center gap-2.5">
                        <p class="text-sm text-[#646464]">
                            Был оформлен <span x-text="order.created_at" class="text-black font-medium"></span> - статус
                            заказа
                        </p>
                        <div :style="`border-color: ${order.color}`"
                             class="flex w-fit border rounded-lg items-center gap-2 py-1 px-2">
                            <p :style="`color: ${order.color}`">&bull;</p>
                            <p class="uppercase font-medium text-[11px]" :style="`color: ${order.color}`"
                               x-text="order.status_label"></p>
                        </div>
                    </div>
                </div>
                <div class="border rounded-lg">
                    <div class="flex justify-between p-5 border-b">
                        <p class="font-bold text-xl">Товар</p>
                        <p class="font-bold text-xl">Итого</p>
                    </div>
                    <template x-for="item in order.items" :key="item.id">
                        <div class="flex justify-between p-4 border-b">
                            <div class="flex gap-4">
                                <p class="font-medium" x-text="item.product_name"></p>
                                <p class="text-sm text-[#7A7A7E]" x-text="'x' + item.quantity"></p>
                            </div>
                            <p class="text-[#003B73] text-xl whitespace-nowrap" x-text="item.subtotal + ' ₽'"></p>
                        </div>
                    </template>
                    <div class="flex justify-between p-5 border-b">
                        <p>Сумма:</p>
                        <p class="text-[#003B73] text-xl whitespace-nowrap"
                           x-text="order.total_price - order.delivery_cost + ' ₽'"></p>
                    </div>
                    <div class="flex justify-between p-5 border-b">
                        <p>Доставка:</p>
                        <p class="text-[#003B73] text-xl whitespace-nowrap" x-text="order.delivery_cost + ' ₽'"></p>
                    </div>
                    <div class="flex justify-between p-5 border-b">
                        <p>Способ доставки:</p>
                        <p class="text[#494950]" x-text="order.delivery_method"></p>
                    </div>
                    <div class="flex justify-between p-5 border-b">
                        <p>Способ оплаты:</p>
                        <p class="text[#494950]" x-text="order.payment_method"></p>
                    </div>
                    <div class="flex justify-between p-5 border-b">
                        <p class="text-2xl">Итого:</p>
                        <p class="text-[#003B73] text-2xl whitespace-nowrap" x-text="order.total_price + ' ₽'"></p>
                    </div>
                </div>
                <div class="border rounded-lg px-7 pt-5 pb-7">
                    <p class="font-medium text-xl mb-8" x-text="order.lastname + ' ' + order.firstname"></p>
                    <div class="flex justify-between">
                        <p class="font-medium" x-text="order.address"></p>
                        <div>
                            <p class="text-[#87878D] text-sm">Телефон:</p>
                            <p class="font-medium" x-text="order.phone_number"></p>
                        </div>
                        <div>
                            <p class="text-[#87878D] text-sm">Email:</p>
                            <p class="font-medium" x-text="order.mail"></p>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
{% endblock %}

{% block account_script %}
    <script>
        const order_status_colors = {
            "processing": "#FF6915",
            "completed": "#11A342",
            "cancelled": "#F81D2A",
            "pending_payment": "#F81D2A",
            "in_transit": '#3b82f6',
        }

        function orderController() {
            return {
                order: null,

                async init() {
                    await this.fetchOrder();
                },

                async fetchOrder() {
                    const paths_list = window.location.href.split('/');
                    const order_id = paths_list[paths_list.length - 2];

                    const response = await api('/api/v1/order/' + order_id + '/', {
                        method: 'GET',
                    })

                    const data = await response.json();
                    console.log(data);

                    data.data['color'] = order_status_colors[data.data['status']];


                    this.order = data.data;
                }
            }
        }
    </script>
{% endblock %}

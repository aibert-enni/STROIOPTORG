{% extends 'users/account/account.html' %}
{% load static %}

{% block account_content %}
    <div x-data="addressController">
        <h3 class="h3 mb-6">Мой адрес доставки</h3>
        <template x-if="!loading">
            <div>
                <template x-if="address">
                    <div class="border rounded-lg">
                        <div class="px-7 pt-5 mb-11">
                            <p class="text-xl font-medium mb-3" x-text="address.firstname + ' ' + address.lastname"></p>
                            <div class="flex justify-between items-center">
                                <p class="font-medium text-[#3B3B3E]" x-text="address.full_address"></p>
                                <div>
                                    <p class="text-[#87878D] text-sm">Телефон</p>
                                    <p class="font-medium text-[#3B3B3E]" x-text="address.phone_number"></p>
                                </div>
                                <div>
                                    <p class="text-[#87878D] text-sm">Email</p>
                                    <p class="font-medium text-[#3B3B3E]" x-text="address.email"></p>
                                </div>
                            </div>
                        </div>
                        <div class="w-fit flex items-center gap-14 border-t border-r rounded-tr-lg py-4 px-7">
                            <a href="{% url 'users:delivery-address-edit' %}" class="flex items-center gap-2">
                                <img src="{% static 'images/address-edit-icon.svg' %}" alt="">
                                <p class="uppercase font-medium text-[11px]">Редактировать</p>
                            </a>
                            <button @click="deleteAddress()" class="flex items-center gap-2">
                                <img src="{% static 'images/address-delete-icon.svg' %}" alt="">
                                <p class="uppercase font-medium text-[11px]">Удалить</p>
                            </button>
                        </div>
                    </div>
                </template>
                <template x-if="!address">
                    <div class="flex flex-col items-center w-full">
                        <p class="h3">У вас нету адреса доставки</p>
                        <a href="{% url 'users:delivery-address-create' %}"
                           class="bg-black w-fit rounded-lg uppercase font-bold text-[13px] text-white px-8 py-4 mt-4">
                            Добавить
                        </a>
                    </div>
                </template>
            </div>
        </template>
    </div>
{% endblock %}

{% block account_script %}
    <script>
        function addressController() {
            return {
                loading: true,
                address: null,

                async init() {
                    await this.fetchAddress();
                },

                async fetchAddress() {
                    try {
                        const response = await api(`/api/v1/auth/user/address/me/`, {
                            'method': 'GET',
                        })

                        if (!response.ok) {
                            const errorData = await response.json()
                            console.log(errorData)
                            if (errorData.status_code === 404) {
                                this.loading = false;
                            }
                            return;
                        }

                        const data = await response.json()
                        this.address = data
                        this.loading = false
                        console.log(data)
                    } catch (error) {
                        if (error.response.status === 404) {
                            this.loading = false;
                        }
                        console.log(error)
                    }
                },

                async deleteAddress() {
                    try {
                        const response = await api(`/api/v1/auth/user/address/me/`, {
                            'method': 'DELETE',
                        })

                        if (!response.ok) {
                            return
                        }

                        this.address = null
                    } catch (e) {
                        console.log(e)
                    }
                }
            }
        }
    </script>
{% endblock %}

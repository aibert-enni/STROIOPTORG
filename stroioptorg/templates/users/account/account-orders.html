{% extends 'users/account/account.html' %}
{% load static %}

{% block account_content %}
    <div x-data="ordersController">
        <p class="h3 mb-6">История заказов</p>
        <template x-if="orders_data && orders_data.results">
            <div>
                <table class="cart-table">
                    <thead>
                    <tr class="border-b">
                        <th class="text-left text-[#45484A] text-sm font-bold uppercase pl-5">Номер</th>
                        <th class="text-left text-[#45484A] text-sm font-bold uppercase">Дата</th>
                        <th class="text-left text-[#45484A] text-sm font-bold uppercase">Статус</th>
                        <th class="text-left text-[#45484A] text-sm font-bold uppercase pr-5">Итого</th>
                    </tr>
                    </thead>
                    <tbody class="font-normal">
                    <template x-for="order in orders_data.results" :key="order.id">
                        <tr class="border" :id="order.id">
                            <td class="pr-5">
                                <p x-text="'#' + order.id"></p>
                            </td>
                            <td class="pr-5">
                                <p x-text="order.created_at"></p>
                            </td>
                            <td class="pr-5">
                                <div :style="`border-color: ${order.color}`"
                                     class="flex w-fit border rounded-lg items-center gap-2 py-1 px-2">
                                    <p :style="`color: ${order.color}`">&bull;</p>
                                    <p class="uppercase font-medium text-sm" :style="`color: ${order.color}`"
                                       x-text="order.status_label"></p>
                                </div>
                            </td>
                            <td>
                                <div class="flex w-full justify-between items-center">
                                    <p class="text-[#003B73] text-xl whitespace-nowrap"><span
                                            x-text="order.total_price"></span> ₽</p>
                                    <div class="bg-[#F6F8FB] ml-4 rounded-lg h-12 w-12 flex justify-center items-center">
                                        <a :href="`/account/orders/${order.id}`" class="text-[#186FD4] rounded-lg">
                                            >
                                        </a>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </template>
                    </tbody>
                </table>
                <div class="flex mt-6 gap-2.5">
                    <button @click="getPrevOrders()" id="orders_prev_btn" :disabled="orders_data.previous == null"
                            class="py-5 px-6 border rounded-lg border-[#DFDFDF] flex justify-center items-center gap-2.5 cursor-pointer hover:bg-black hover:text-white">
                        <svg width="23" height="10" viewBox="0 0 23 10" fill="none"
                             xmlns="http://www.w3.org/2000/svg">
                            <path d="M0.540381 4.54038C0.28654 4.79422 0.28654 5.20578 0.540381 5.45962L4.67696 9.59619C4.9308 9.85003 5.34235 9.85003 5.59619 9.59619C5.85003 9.34235 5.85003 8.9308 5.59619 8.67696L1.91924 5L5.59619 1.32304C5.85003 1.0692 5.85003 0.657647 5.59619 0.403806C5.34235 0.149965 4.9308 0.149965 4.67696 0.403806L0.540381 4.54038ZM23 5V4.35L1 4.35V5V5.65L23 5.65V5Z"
                                  fill="currentColor"></path>
                        </svg>
                        <p>Назад</p>
                    </button>
                    <template x-for="pagination in pagination_range">
                        <button @click="getOrdersByPage(pagination)" x-text="pagination"
                                :class="pagination == orders_data.current_page
                                        ? 'py-5 px-6 border rounded-lg flex justify-center items-center gap-2.5 cursor-pointer bg-black text-white'
                                        : 'py-5 px-6 border rounded-lg border-[#DFDFDF] flex justify-center items-center gap-2.5 cursor-pointer hover:bg-black hover:text-white'">
                        </button>
                    </template>
                    <button @click="getNextOrders()" id="orders_next_btn" :disabled="orders_data.next == null"
                            class="py-5 px-6 border rounded-lg border-[#DFDFDF] flex justify-center items-center gap-2.5 cursor-pointer hover:bg-black hover:text-white">
                        <p>Далее</p>
                        <svg class="rotate-180" width="23" height="10" viewBox="0 0 23 10" fill="none"
                             xmlns="http://www.w3.org/2000/svg">
                            <path d="M0.540381 4.54038C0.28654 4.79422 0.28654 5.20578 0.540381 5.45962L4.67696 9.59619C4.9308 9.85003 5.34235 9.85003 5.59619 9.59619C5.85003 9.34235 5.85003 8.9308 5.59619 8.67696L1.91924 5L5.59619 1.32304C5.85003 1.0692 5.85003 0.657647 5.59619 0.403806C5.34235 0.149965 4.9308 0.149965 4.67696 0.403806L0.540381 4.54038ZM23 5V4.35L1 4.35V5V5.65L23 5.65V5Z"
                                  fill="currentColor"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </template>
    </div>
{% endblock %}

{% block account_script %}
    <script>
        const order_status_colors = {
            "processing": "#FF6915",
            "completed": "#11A342",
            "cancelled": "#F81D2A",
            "pending_payment": "#F81D2A",
            "in_transit": '#3b82f6',
        }

        function ordersController() {
            return {
                orders_data: null,

                orders_pagination_range: [],

                async init() {
                    await this.fetchOrdersData()
                },

                async fetchOrdersData({url = '/api/v1/orders/me', page = null} = {}) {
                    if (page) {
                        url += `/?page=${page}`
                    }

                    const response = await fetch(url, {
                        'method': 'GET',
                    })

                    const data = await response.json()

                    for (const order of data.results) {
                        order['color'] = order_status_colors[order['status']]
                    }

                    this.orders_data = data

                    console.log(data)
                },

                async getNextOrders() {
                    if (!this.orders_data && !this.orders_data.next) {
                        return
                    }

                    await this.fetchOrdersData({url: this.orders_data.next})
                },

                async getPrevOrders() {
                    if (!this.orders_data && !this.orders_data.previous) {
                        return
                    }

                    await this.fetchOrdersData({url: this.orders_data.previous})
                },

                async getOrdersByPage(page) {
                    if (this.orders_data.current_page == page || page == '...') {
                        return
                    }

                    await this.fetchOrdersData({page: page})
                },

                get pagination_range() {
                    const current = this.orders_data.current_page;
                    const total = this.orders_data.max_page;
                    const delta = 2;
                    const range = [];
                    const left = Math.max(1, current - delta);
                    const right = Math.min(total, current + delta);

                    if (left > 2) {
                        range.push(1);
                        range.push("...");
                    } else {
                        for (let i = 1; i < left; i++) {
                            range.push(i);
                        }
                    }

                    for (let i = left; i <= right; i++) {
                        range.push(i);
                    }

                    if (right < total - 1) {
                        range.push("...");
                        range.push(total);
                    } else {
                        for (let i = right + 1; i <= total; i++) {
                            range.push(i);
                        }
                    }

                    console.log(range)

                    return range;
                },
            }
        }
    </script>
{% endblock %}
